name: Zenline AI
description: >-
  Zenline AI (Zenline GmbH / Zenline AG) is a Swiss assortment-intelligence platform for retail
  category teams. It blends public market data with a retailer's own product data to recommend
  pricing, product consolidation, and new-product launches, surfacing market white spots, sell-out
  trends, substitutes and variants so category managers can improve margin and portfolio performance
  across omni-channel retail. Backed by Seedcamp and used by European retailers including Otto Group,
  Conrad Electronic, Lapeyre and Fressnapf/Das Futterhaus. ISO 27001 certified. As of this enrichment
  pass Zenline publishes no public API, developer portal, SDKs, or MCP server.
